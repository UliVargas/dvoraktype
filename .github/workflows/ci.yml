name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # PR runs share a group per branch so a new push cancels the superseded run.
  # Pushes to main get a group per commit, so none of them is queued behind
  # (and cancelled by) a later one: every commit on main gets its own result.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, types, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Keep this service identical to the one in the docker job
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      # Integration tests in src/server/*.test.ts run against this database
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build.types
      - run: pnpm test
      - run: pnpm build

  docker:
    name: Docker image boots and serves
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Keep this service identical to the one in the check job
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: dvoraktype:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Booting catches what a build alone can't, such as migrations missing
      # from the image: the server applies them before it starts listening.
      - name: Boot the image against Postgres
        run: |
          docker run -d --name app --network host \
            -e DATABASE_URL=postgres://postgres:postgres@localhost:5432/postgres \
            -e PORT=3000 \
            dvoraktype:ci
          # "Server started" is logged by app.listen in src/entry.express.tsx,
          # after migrations ran. Allow up to 60 s for migrations on a cold runner.
          booted=false
          for i in $(seq 1 60); do
            if docker logs app 2>&1 | grep -q "Server started"; then booted=true; break; fi
            if [ "$(docker inspect -f '{{.State.Running}}' app)" != "true" ]; then break; fi
            sleep 1
          done
          docker logs app
          if [ "$booted" != "true" ]; then
            echo "::error::The image did not boot: $(docker inspect -f 'running={{.State.Running}} exit={{.State.ExitCode}}' app)"
            exit 1
          fi
          curl -fsS -o /dev/null -w "GET / -> %{http_code}\n" http://localhost:3000/
          curl -fsS -o /dev/null -w "GET /sugerencias/ -> %{http_code}\n" http://localhost:3000/sugerencias/
          # The image must run the Node version the repo pins
          test "$(docker exec app node -v)" = "v$(cat .node-version)"
